services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: recipe
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - recipe-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipe"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  recipe-postgres:
